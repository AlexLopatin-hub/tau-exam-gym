openapi: 3.0.3
info:
  title: Вопросы по ТАУ
  version: 1.0.0
  description: >
    HTTP-контракт браузерного интерфейса. Создание и завершение попытки
    не требуют тела запроса. После редиректа браузер запрашивает страницу методом GET.
security: []
paths:
  /:
    get:
      operationId: examHome
      summary: Открыть вкладку «Экзамен»
      parameters:
        - $ref: "#/components/parameters/HxRequest"
        - name: attempt
          in: query
          description: Идентификатор завершённой попытки из истории этого браузера.
          schema:
            type: string
      responses:
        "200":
          description: Страница запуска и локальной истории экзаменов. С параметром attempt браузер показывает билет из своего хранилища.
          content:
            text/html:
              schema:
                type: string
  /archive/render:
    post:
      operationId: renderArchivedExam
      summary: Отобразить завершённый билет из истории браузера
      description: Возвращает карточки из переданной копии билета без записи в хранилище попыток.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [Finished, FinishedAt, Questions]
              properties:
                ID: {type: string}
                Finished: {type: boolean, enum: [true]}
                FinishedAt: {type: string, format: date-time}
                Questions:
                  type: array
                  description: В новых билетах 20 вопросов, в ранее сохранённых билетах 30.
                  oneOf:
                    - minItems: 20
                      maxItems: 20
                    - minItems: 30
                      maxItems: 30
                  items:
                    type: object
                    required: [id, text, answer, difficulty]
                    properties:
                      id: {type: string}
                      text: {type: string}
                      answer: {type: string}
                      difficulty: {type: string}
                      format: {type: string, enum: [mathml]}
                UserAnswers:
                  type: object
                  nullable: true
                  additionalProperties: {type: string}
      responses:
        "200":
          description: HTML-фрагмент с вопросами и ответами для сверки.
          content:
            text/html:
              schema: {type: string}
        "400":
          description: Некорректный архивный билет.
        "403":
          $ref: "#/components/responses/CrossOriginDenied"
        "413":
          description: Размер JSON превышает 16 МиБ.
  /static/app.css:
    get:
      operationId: getApplicationStyles
      summary: Получить стили интерфейса
      responses:
        "200":
          description: Таблица стилей приложения.
          content:
            text/css:
              schema: {type: string}
  /static/app.js:
    get:
      operationId: getApplicationScript
      summary: Получить скрипт интерфейса
      responses:
        "200":
          description: Скрипт приложения.
          content:
            text/javascript:
              schema: {type: string}
            application/javascript:
              schema: {type: string}
  /questions:
    get:
      operationId: listQuestions
      summary: Открыть вкладку «Все вопросы»
      parameters:
        - $ref: "#/components/parameters/HxRequest"
        - name: page
          in: query
          description: Номер страницы каталога. На каждой странице до 10 вопросов в порядке банка.
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: Карточки выбранной страницы с формулировками и сложностью. Ответы изначально свёрнуты. Если страниц несколько, доступны переходы по каталогу.
          content:
            text/html:
              schema:
                type: string
        "404":
          description: Номер страницы некорректен или выходит за пределы каталога.
          content:
            text/html:
              schema:
                type: string
  /lectures:
    get:
      operationId: latestLecture
      summary: Открыть вкладку «Конспекты»
      parameters:
        - $ref: "#/components/parameters/HxRequest"
      responses:
        "200":
          description: Последняя лекция и меню дат в хронологическом порядке, с названиями месяцев по-русски.
          content:
            text/html:
              schema: {type: string}
        "500":
          description: Не удалось отобразить конспекты.
  /lectures/{date}:
    get:
      operationId: lectureByDate
      summary: Открыть конспект лекции по дате
      parameters:
        - $ref: "#/components/parameters/HxRequest"
        - name: date
          in: path
          required: true
          description: Дата в формате ММ-ДД.
          schema:
            type: string
            pattern: '^[0-9]{2}-[0-9]{2}$'
          example: "10-17"
      responses:
        "200":
          description: Конспект выбранной лекции с формулами и меню дат.
          content:
            text/html:
              schema: {type: string}
        "308":
          description: Старый адрес с датой в формате ММ.ДД перенаправляет на адрес в формате ММ-ДД.
          headers:
            Location:
              schema:
                type: string
                example: /lectures/10-17
        "404":
          description: Лекция с такой датой не найдена.
          content:
            text/html:
              schema: {type: string}
        "500":
          description: Не удалось отобразить конспекты.
  /exams:
    post:
      operationId: startExam
      summary: Создать тренировочную попытку
      description: Случайная выборка 20 вопросов из общего банка без повторений, из них 7 лёгких, 7 средних и 6 сложных.
      responses:
        "403":
          $ref: "#/components/responses/CrossOriginDenied"
        "303":
          $ref: "#/components/responses/SeeExam"
        "503":
          description: Недостаточно вопросов для билета или все места для попыток заняты. Попытка не создана.
          content:
            text/html:
              schema:
                type: string
  /exams/{id}:
    parameters:
      - $ref: "#/components/parameters/ExamId"
    get:
      operationId: showExam
      summary: Открыть билет или посмотреть правильные ответы
      parameters:
        - $ref: "#/components/parameters/HxRequest"
      responses:
        "200":
          description: >
            Вопросы отсортированы по возрастанию сложности. В активной попытке
            ответы включены в HTML и изначально свёрнуты. Браузер переключает их локально.
            В активном билете можно вводить и редактировать свои ответы.
            Завершённая попытка показывает свои и правильные ответы постоянно, без элементов
            сворачивания. Состав и порядок билета сохраняются.
          content:
            text/html:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/ExamNotFound"
  /exams/{id}/finish:
    parameters:
      - $ref: "#/components/parameters/ExamId"
    post:
      operationId: finishExam
      summary: Завершить попытку и перейти к ответам
      description: Сохраняет ответы для самостоятельной сверки. Повторное завершение сохраняет первоначальный результат.
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              description: Имена полей — идентификаторы вопросов билета. Любой ответ можно пропустить.
              additionalProperties:
                type: string
      responses:
        "400":
          description: Не удалось прочитать форму с ответами.
        "403":
          $ref: "#/components/responses/CrossOriginDenied"
        "413":
          description: Размер закодированной формы превышает 256 КиБ. Попытка не завершена.
        "303":
          $ref: "#/components/responses/SeeExam"
        "404":
          $ref: "#/components/responses/ExamNotFound"
components:
  parameters:
    HxRequest:
      name: HX-Request
      in: header
      required: false
      description: Значение true запрашивает HTML-фрагмент для обновляемой части страницы.
      schema:
        type: boolean
        default: false
    ExamId:
      name: id
      in: path
      required: true
      description: Непрозрачный идентификатор из адреса созданной попытки.
      schema:
        type: string
        minLength: 1
  responses:
    CrossOriginDenied:
      description: Браузер отправил запрос с другого источника.
      content:
        text/plain:
          schema:
            type: string
    SeeExam:
      description: Перейти методом GET к созданной или завершённой попытке.
      headers:
        Location:
          required: true
          description: Адрес страницы попытки.
          schema:
            type: string
            example: /exams/a1b2c3
    ExamNotFound:
      description: Попытка с таким идентификатором не найдена или истекли 24 часа с момента создания.
      content:
        text/html:
          schema:
            type: string
