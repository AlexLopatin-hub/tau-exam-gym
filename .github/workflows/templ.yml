name: templ

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    name: Check generated templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go tool templ generate -check
      - name: Check generated lectures
        run: |
          go generate ./internal/exam
          git diff --exit-code -- internal/exam/lecture_pages.json
